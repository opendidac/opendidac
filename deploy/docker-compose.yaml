name: eval

# Docker drops whole files, so (max-file - 1) x max-size is always kept:
# at least 30 days at the growth measured on PROD-SI (#690).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - assets:/app/assets
    environment:
      - DOCKER_HOST=tcp://sandbox:2375
    depends_on:
      - db
      - sandbox
    networks:
      - app-network
    logging: *default-logging

  db:
    image: postgres:15.0
    restart: unless-stopped
    env_file:
      - ./db/.env.db.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    logging: *default-logging
    # Leave Postgres time to checkpoint on shutdown instead of the 10 s default
    stop_grace_period: 1m

  nginx:
    image: nginx:1.30
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - app-network
    # The access log grows ~12.5 MB/day on average; 900 MB covers 30 days up to 25 MB/day
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"

  sandbox:
    image: docker:28.2.2-dind
    runtime: sysbox-runc
    restart: unless-stopped
    expose:
      - "2375"
    environment:
      - DOCKER_TLS_CERTDIR=
    networks:
      - app-network
    logging: *default-logging

volumes:
  pgdata:
  assets:

networks:
  app-network:
    driver: bridge
